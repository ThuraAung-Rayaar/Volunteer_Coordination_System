<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard & Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 p-8">
    <h1 class="text-3xl font-bold text-slate-800 mb-6">Volunteer HR Management - Admin Dashboard</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-xl shadow">
            <h3 class="text-gray-500 font-medium">Active Events</h3>
            <p class="text-3xl font-bold text-blue-600 mt-2">12</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow">
            <h3 class="text-gray-500 font-medium">Total Volunteers</h3>
            <p class="text-3xl font-bold text-emerald-600 mt-2">480</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow">
            <h3 class="text-gray-500 font-medium">Pending Approvals</h3>
            <p class="text-3xl font-bold text-amber-600 mt-2">24</p>
        </div>
    </div>
</body>
</html>
