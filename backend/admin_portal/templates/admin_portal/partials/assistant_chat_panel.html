<!-- Reusable Floating AI Assistant Launcher & Panel for Admin Portal -->
<div id="vcs-admin-assistant-container"
     data-actor-id="{{ request.user.id|default:'' }}"
     class="fixed bottom-6 right-6 z-50 font-sans">
    <!-- Floating Launcher Button -->
    <button id="vcs-assistant-launcher" type="button"
            class="flex items-center gap-2 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-full shadow-lg hover:shadow-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
        </svg>
        <span class="text-sm">VCS Assistant</span>
    </button>

    <!-- Chat Panel Window -->
    <div id="vcs-assistant-window" class="hidden flex-col w-96 max-w-[calc(100vw-2rem)] h-[520px] max-h-[calc(100vh-6rem)] bg-white rounded-2xl shadow-2xl border border-amber-200/70 overflow-hidden transition-all duration-200">
        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-3 bg-slate-900 text-white">
            <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
                <div>
                    <h3 class="text-sm font-semibold text-slate-100">VCS Assistant</h3>
                    <p class="text-[10px] text-slate-400">Read-Only Operations & Guidance</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <select id="vcs-assistant-lang" aria-label="Assistant language"
                        class="bg-slate-800 text-slate-200 text-xs rounded px-1.5 py-0.5 border border-slate-700">
                    <option value="en">EN</option>
                    <option value="my">MY</option>
                </select>
                <button id="vcs-assistant-clear" type="button" title="Clear conversation"
                        class="p-1 text-slate-400 hover:text-slate-200 rounded transition-colors text-xs">
                    Clear
                </button>
                <button id="vcs-assistant-close" type="button" title="Close"
                        class="p-1 text-slate-400 hover:text-white rounded transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Messages Scroll Area -->
        <div id="vcs-assistant-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-[#FAF4E8]/40 text-sm">
            <!-- Initial Greeting + Dynamic Prompt Catalogue -->
            <div class="flex gap-2.5 items-start">
                <div class="w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold shrink-0">
                    AI
                </div>
                <div class="bg-white p-3 rounded-2xl rounded-tl-sm border border-amber-200/60 shadow-sm text-slate-800 space-y-2 w-full">
                    <p>Hello! I am your read-only VCS assistant. Choose an authorized prompt below or ask a question.</p>
                    <div id="vcs-assistant-prompts" class="flex flex-wrap gap-1.5 pt-1 text-xs text-slate-500">
                        Loading prompts...
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Box -->
        <div class="p-3 border-t border-amber-200/60 bg-white">
            <form id="vcs-assistant-form" class="flex items-center gap-2">
                <input id="vcs-assistant-input" type="text" maxlength="2000" placeholder="Ask about public events or workflows..."
                       class="flex-1 px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 focus:bg-white transition-all text-slate-800" />
                <button id="vcs-assistant-send" type="submit"
                        class="p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors disabled:opacity-50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
(function() {
    const container = document.getElementById('vcs-admin-assistant-container');
    const launcher = document.getElementById('vcs-assistant-launcher');
    const windowEl = document.getElementById('vcs-assistant-window');
    const closeBtn = document.getElementById('vcs-assistant-close');
    const clearBtn = document.getElementById('vcs-assistant-clear');
    const langSelect = document.getElementById('vcs-assistant-lang');
    const messagesEl = document.getElementById('vcs-assistant-messages');
    const form = document.getElementById('vcs-assistant-form');
    const input = document.getElementById('vcs-assistant-input');
    const sendBtn = document.getElementById('vcs-assistant-send');

    // Ephemeral page-memory state only (never stored in storage or DB).
    let conversationHistory = [];
    let isSubmitting = false;
    let activeEpoch = 0;
    let catalogPrompts = [];
    let lastFailedPayload = null;

    function escapeHtml(str) {
        const p = document.createElement('p');
        p.textContent = String(str == null ? '' : str);
        return p.innerHTML;
    }

    function getCsrfToken() {
        const cookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
        return cookie ? cookie.split('=')[1] : '';
    }

    function renderPromptChips(targetEl) {
        if (!targetEl) return;
        targetEl.innerHTML = '';
        if (!catalogPrompts.length) {
            const note = document.createElement('span');
            note.className = 'text-xs text-slate-500';
            note.textContent = 'No predefined prompts available.';
            targetEl.appendChild(note);
            return;
        }
        catalogPrompts.forEach(item => {
            if (!item.available) return;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'vcs-suggestion-chip px-2 py-1 text-xs bg-amber-50 hover:bg-amber-100 text-slate-700 rounded-md border border-amber-200/70 transition-colors text-left';
            btn.setAttribute('data-prompt-key', item.key);
            btn.setAttribute('data-prompt', item.label);
            btn.title = item.description || '';
            btn.textContent = item.label;
            targetEl.appendChild(btn);
        });
    }

    async function loadPrompts() {
        const promptsEl = document.getElementById('vcs-assistant-prompts');
        if (!promptsEl) return;
        promptsEl.textContent = 'Loading prompts...';
        const epoch = activeEpoch;
        const lang = langSelect ? langSelect.value : 'en';
        try {
            const res = await fetch(`/api/v1/assistant/prompts/?language=${encodeURIComponent(lang)}`, {
                method: 'GET',
                credentials: 'same-origin',
            });
            if (epoch !== activeEpoch) return;
            if (!res.ok) {
                promptsEl.innerHTML = '';
                const errSpan = document.createElement('span');
                errSpan.className = 'text-xs text-rose-600';
                errSpan.textContent = 'Could not load prompts. ';
                const retryBtn = document.createElement('button');
                retryBtn.type = 'button';
                retryBtn.className = 'underline font-medium';
                retryBtn.textContent = 'Retry';
                retryBtn.addEventListener('click', loadPrompts);
                promptsEl.appendChild(errSpan);
                promptsEl.appendChild(retryBtn);
                return;
            }
            const data = await res.json();
            if (epoch !== activeEpoch) return;
            catalogPrompts = Array.isArray(data.prompts) ? data.prompts : [];
            renderPromptChips(promptsEl);
        } catch (_err) {
            if (epoch !== activeEpoch) return;
            promptsEl.textContent = 'Prompt catalogue unavailable offline.';
        }
    }

    function resetConversation(noticeText) {
        activeEpoch += 1;
        conversationHistory = [];
        lastFailedPayload = null;
        isSubmitting = false;
        input.disabled = false;
        sendBtn.disabled = false;

        messagesEl.innerHTML = '';
        const row = document.createElement('div');
        row.className = 'flex gap-2.5 items-start';
        const avatar = document.createElement('div');
        avatar.className = 'w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold shrink-0';
        avatar.textContent = 'AI';
        const card = document.createElement('div');
        card.className = 'bg-white p-3 rounded-2xl rounded-tl-sm border border-amber-200/60 shadow-sm text-slate-800 space-y-2 w-full';
        const p = document.createElement('p');
        p.textContent = noticeText || 'Hello! I am your read-only VCS assistant. Choose an authorized prompt below or ask a question.';
        const promptBox = document.createElement('div');
        promptBox.id = 'vcs-assistant-prompts';
        promptBox.className = 'flex flex-wrap gap-1.5 pt-1';
        card.appendChild(p);
        card.appendChild(promptBox);
        row.appendChild(avatar);
        row.appendChild(card);
        messagesEl.appendChild(row);
        loadPrompts();
    }

    function toggleChat(open) {
        if (open) {
            windowEl.classList.remove('hidden');
            windowEl.classList.add('flex');
            launcher.classList.add('hidden');
            input.focus();
            if (!catalogPrompts.length) {
                loadPrompts();
            }
        } else {
            windowEl.classList.add('hidden');
            windowEl.classList.remove('flex');
            launcher.classList.remove('hidden');
        }
    }

    launcher.addEventListener('click', () => toggleChat(true));
    closeBtn.addEventListener('click', () => toggleChat(false));
    clearBtn.addEventListener('click', () => resetConversation('Conversation cleared. How can I assist you today?'));
    if (langSelect) {
        langSelect.addEventListener('change', () => loadPrompts());
    }

    // Clear in-memory history on admin logout link click.
    document.querySelectorAll('a[href*="logout"]').forEach(link => {
        link.addEventListener('click', () => {
            activeEpoch += 1;
            conversationHistory = [];
            catalogPrompts = [];
        });
    });

    function appendUserMessage(text) {
        const div = document.createElement('div');
        div.className = 'flex justify-end';
        div.innerHTML = `
            <div class="bg-blue-600 text-white px-3.5 py-2 rounded-2xl rounded-tr-sm max-w-[85%] shadow-sm text-sm break-words">
                ${escapeHtml(text)}
            </div>
        `;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function buildSafeActionUrl(action) {
        if (!action || !action.type) return null;
        if ((action.type === 'open_event' || action.type === 'open_staffing') && Number.isInteger(Number(action.event_id))) {
            return `/api/v1/admin/ui/events/?event_id=${encodeURIComponent(Number(action.event_id))}`;
        }
        return null;
    }

    function appendAssistantMessage(data, retryable) {
        const div = document.createElement('div');
        div.className = 'flex gap-2.5 items-start';

        let sourcesHtml = '';
        if (Array.isArray(data.sources) && data.sources.length > 0) {
            const sourceBadges = data.sources
                .map(src => `<span class="px-2 py-0.5 text-[11px] bg-slate-100 text-slate-700 border border-slate-200 rounded">${escapeHtml(src.label || (src.type + ' #' + (src.id || '')))}</span>`)
                .join('');
            sourcesHtml = `<div class="flex flex-wrap gap-1 pt-1.5">${sourceBadges}</div>`;
        }

        let actionsHtml = '';
        if (Array.isArray(data.suggested_actions) && data.suggested_actions.length > 0) {
            const links = [];
            data.suggested_actions.forEach(action => {
                const safeUrl = buildSafeActionUrl(action);
                if (safeUrl) {
                    const label = action.label ? action.label : `View Event #${Number(action.event_id)}`;
                    links.push(`<a href="${safeUrl}" class="px-2 py-0.5 text-xs bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 rounded font-medium">${escapeHtml(label)} &rarr;</a>`);
                }
            });
            if (links.length > 0) {
                actionsHtml = `<div class="flex flex-wrap gap-1.5 pt-2">${links.join('')}</div>`;
            }
        }

        const fallbackTag = data.fallback_used
            ? '<p class="text-[10px] italic text-slate-500 pt-1">Deterministic backend summary</p>'
            : '';

        div.innerHTML = `
            <div class="w-7 h-7 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold shrink-0">AI</div>
            <div class="bg-white p-3 rounded-2xl rounded-tl-sm border border-amber-200/60 shadow-sm text-slate-800 max-w-[85%] space-y-1 break-words">
                <div class="whitespace-pre-line leading-relaxed">${escapeHtml(data.answer || '')}</div>
                ${fallbackTag}
                ${sourcesHtml}
                ${actionsHtml}
            </div>
        `;

        if (retryable && lastFailedPayload) {
            const retryBtn = document.createElement('button');
            retryBtn.type = 'button';
            retryBtn.className = 'mt-1.5 px-2.5 py-1 text-xs font-medium text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded';
            retryBtn.textContent = 'Retry';
            retryBtn.addEventListener('click', () => {
                const payload = lastFailedPayload;
                lastFailedPayload = null;
                submitAssistantRequest(payload.displayText, payload.promptKey);
            });
            div.querySelector('.bg-white')?.appendChild(retryBtn);
        }

        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function submitAssistantRequest(displayText, promptKey) {
        if (isSubmitting) return;
        const cleanText = String(displayText || '').trim();
        if (!cleanText && !promptKey) return;

        isSubmitting = true;
        input.disabled = true;
        sendBtn.disabled = true;
        const requestEpoch = activeEpoch;

        appendUserMessage(cleanText || promptKey);
        if (!promptKey) {
            input.value = '';
        }

        const loadingId = 'vcs-loading-' + Date.now();
        const loadingDiv = document.createElement('div');
        loadingDiv.id = loadingId;
        loadingDiv.className = 'flex gap-2.5 items-start text-slate-400 text-xs italic';
        loadingDiv.innerHTML = '<div class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-xs">AI</div><div class="p-2">Thinking...</div>';
        messagesEl.appendChild(loadingDiv);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        const lang = langSelect ? langSelect.value : 'en';
        try {
            const res = await fetch('/api/v1/assistant/chat/', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                },
                body: JSON.stringify({
                    prompt_key: promptKey || '',
                    message: cleanText,
                    language: lang,
                    conversation: conversationHistory,
                }),
            });

            document.getElementById(loadingId)?.remove();
            if (requestEpoch !== activeEpoch) return;

            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                lastFailedPayload = { displayText: cleanText, promptKey: promptKey || '' };
                appendAssistantMessage({
                    answer: 'Sorry, I encountered an issue processing your request: ' + (errData.detail || errData.message || res.statusText),
                }, true);
                return;
            }

            const data = await res.json();
            if (requestEpoch !== activeEpoch) return;

            lastFailedPayload = null;
            appendAssistantMessage(data, false);

            conversationHistory.push({ role: 'user', content: cleanText || promptKey });
            conversationHistory.push({ role: 'assistant', content: data.answer || '' });
            if (conversationHistory.length > 4) {
                conversationHistory = conversationHistory.slice(-4);
            }
        } catch (_err) {
            document.getElementById(loadingId)?.remove();
            if (requestEpoch !== activeEpoch) return;
            lastFailedPayload = { displayText: cleanText, promptKey: promptKey || '' };
            appendAssistantMessage({ answer: 'Network error communicating with the assistant.' }, true);
        } finally {
            if (requestEpoch === activeEpoch) {
                isSubmitting = false;
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }
    }

    messagesEl.addEventListener('click', (e) => {
        const chip = e.target && e.target.closest ? e.target.closest('.vcs-suggestion-chip') : null;
        if (chip) {
            const promptKey = chip.getAttribute('data-prompt-key') || '';
            const promptLabel = chip.getAttribute('data-prompt') || '';
            submitAssistantRequest(promptLabel, promptKey);
        }
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        submitAssistantRequest(text, '');
    });

    // Clear on browser back/forward cache restore if actor attribute changed.
    window.addEventListener('pageshow', () => {
        if (container && !container.getAttribute('data-actor-id')) {
            resetConversation();
        }
    });
})();
</script>
