<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CommonGround Mobile UI</title>
<style>
:root{--canvas:#FAF4E8;--surface:#FFFDF8;--raised:#F3EAD8;--border:#E7DCC4;--text:#0E1A33;--text2:#56607A;--muted:#8E92A0;
--blue:#2563EB;--indigo:#4F46E5;--emerald:#059669;--amber:#C2410C;--rose:#E11D48;--sky:#0369A1;
--g1:#2563EB;--g2:#4F46E5;--hero:linear-gradient(135deg,#E3ECFF 0%,#FFF6E2 100%);--shadow:0 6px 18px rgba(37,99,235,.10);--glow:.18;--bg:#E9E1CF}
body.night{--canvas:#070B14;--surface:#0F172A;--raised:#151F33;--border:#1E293B;--text:#F8FAFC;--text2:#94A3B8;--muted:#64748B;
--blue:#3B82F6;--indigo:#818CF8;--emerald:#34D399;--amber:#FBBF24;--rose:#FB7185;--sky:#38BDF8;
--hero:linear-gradient(135deg,rgba(37,99,235,.22),rgba(99,102,241,.06)),#0F172A;--shadow:0 8px 24px rgba(0,0,0,.35);--glow:.35;--bg:#020409}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;transition:.2s}
.top{display:flex;justify-content:center;gap:8px;margin-bottom:20px;position:sticky;top:0;z-index:9}
.top button{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 18px;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer}
.top button.on{background:linear-gradient(100deg,var(--g1),var(--g2));color:#fff;border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
.phone{width:390px;height:800px;background:var(--canvas);border-radius:38px;border:8px solid #111;position:relative;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.bar .t{flex:1}.bar h1{font-size:17px;font-weight:800;letter-spacing:-.02em}.bar p{font-size:11px;color:var(--muted);margin-top:2px}
.ib{width:40px;height:40px;border-radius:13px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text2);position:relative}
.dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--surface)}
.body{flex:1;overflow:hidden;padding:4px 16px;display:flex;flex-direction:column;gap:14px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sm svg{width:14px;height:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero{background:var(--hero);border:1px solid var(--border);border-radius:24px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero .orb{position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:var(--blue);opacity:.14}
.kick{font-size:12px;font-weight:700;color:var(--blue);margin-top:10px}.ttl{font-size:24px;font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-top:4px}
.sub{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.pill svg{width:12px;height:12px}
.em{--c:var(--emerald)}.sk{--c:var(--sky)}.am{--c:var(--amber)}.ro{--c:var(--rose)}.in{--c:var(--indigo)}.bl{--c:var(--blue)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:14px;font-weight:700;font-size:13px;border:1px solid var(--border);background:var(--raised);color:var(--text)}
.btn.p{background:linear-gradient(100deg,var(--g1),var(--g2));color:#fff;border:0;box-shadow:0 8px 18px rgba(37,99,235,.28)}
.btn.w{background:var(--amber);color:#fff;border:0;height:40px;padding:0 14px}
.grid3,.grid2{display:grid;gap:10px}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr 1fr}
.metric{padding:12px;min-height:96px}.metric .g{position:absolute;right:-14px;top:-16px;width:60px;height:60px;border-radius:50%;background:var(--c);filter:blur(18px);opacity:var(--glow)}
.eb{font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);position:relative}
.mv{font-size:26px;font-weight:800;letter-spacing:-.04em;margin-top:10px;color:var(--c);position:relative}
.md{font-size:10px;color:var(--text2);margin-top:4px;position:relative}
.sh{display:flex;justify-content:space-between;align-items:center;margin-top:2px}.sh b{font-size:15px;letter-spacing:-.02em}.sh a{font-size:11px;font-weight:700;color:var(--blue)}
.ev{display:flex;gap:12px;align-items:center}.date{width:50px;height:56px;border-radius:14px;background:color-mix(in srgb,var(--blue) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--blue) 25%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center}
.date i{font-style:normal;font-size:9px;font-weight:800;color:var(--blue);letter-spacing:.08em}.date b{font-size:20px}
.ev h3{font-size:13px;margin:6px 0 2px}.ev p{font-size:11px;color:var(--text2)}.loc{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--muted);margin-top:5px}
.tabs{height:70px;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--border);padding:8px 8px 14px}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--muted)}.tabs .a{color:var(--blue)}.tabs .a span{background:color-mix(in srgb,var(--blue) 12%,transparent);padding:3px 14px;border-radius:99px}
.alert{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--amber) 10%,var(--surface));border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--raised);border:1px solid var(--border);border-radius:14px}
.seg div{height:38px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}.seg .a{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stats{display:flex;gap:6px;margin-top:10px}.stats span{font-size:10px;font-weight:600;background:var(--raised);color:var(--text2);padding:6px 8px;border-radius:9px}
.scrim{position:absolute;inset:0;background:rgba(10,15,30,.5);backdrop-filter:blur(3px)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:14px 18px 24px;border-top:1px solid var(--border)}
.hd{width:44px;height:4px;border-radius:9px;background:var(--border);margin:0 auto 14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:8px 0 14px}.days div{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--raised);border:1px solid var(--border);color:var(--text2)}.days .a{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 6px 14px rgba(37,99,235,.3)}
.lab{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fld{height:48px;border-radius:12px;background:var(--raised);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;margin-top:6px;font-size:13px;font-weight:600}.fld svg{color:var(--blue);width:18px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.map{height:150px;border-radius:16px;background:color-mix(in srgb,var(--sky) 10%,var(--raised));border:1px solid var(--border);position:relative;overflow:hidden;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:26px 26px}
.fence{position:absolute;left:50%;top:50%;width:110px;height:110px;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid var(--sky);background:color-mix(in srgb,var(--sky) 16%,transparent);display:grid;place-items:center}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--blue);display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.4)}.pin svg{transform:rotate(45deg);width:16px}
.slider{height:6px;border-radius:9px;background:var(--raised);margin-top:12px;position:relative}.slider i{position:absolute;left:0;top:0;height:100%;width:30%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:9px}.slider u{position:absolute;left:30%;top:-6px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--blue);transform:translateX(-50%)}
.prog{height:5px;border-radius:9px;background:var(--raised);margin:0 16px}.prog i{display:block;height:100%;width:43%;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--indigo))}
.foot{display:flex;gap:10px;padding:12px 16px 20px;border-top:1px solid var(--border);background:var(--surface)}
.cap{text-align:center;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:10px}
</style></head><body>
<div class="top"><button id="d" class="on">☀ Day · Blue + Cream</button><button id="n">☾ Night · Figma Slate</button></div>
<div class="row" id="app"></div>
<script>
const P={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',check:'<path d="M5 12l5 5 9-10"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/>',menu:'<path d="M4 7h16M4 12h16M4 17h10"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',brief:'<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'};
const I=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const tabs=a=>`<div class="tabs">${[['home','Home'],['compass','Discover'],['cal','Shifts'],['user','Profile']].map(([i,l],k)=>`<div class="${k==a?'a':''}"><span>${I(i)}</span>${l}</div>`).join('')}</div>`;
const bar=(t,s,l='menu')=>`<div class="bar"><div class="ib">${I(l)}</div><div class="t"><h1>${t}</h1><p>${s}</p></div><div class="ib">${I('bell')}<i class="dot"></i></div></div>`;
const met=(l,v,d,c)=>`<div class="card metric ${c}"><i class="g"></i><div class="eb">${l}</div><div class="mv">${v}</div><div class="md">${d}</div></div>`;
const ev=(d,t,r,p)=>`<div class="card ev"><div class="date"><i>NOV</i><b>${d}</b></div><div style="flex:1"><span class="pill em sm">${I('check')}Confirmed</span><h3>${t}</h3><p>${r}</p><div class="loc sm">${I('pin')}${p}</div></div><div class="ib" style="width:34px;height:34px;border-radius:11px">${I('arrow')}</div></div>`;
const S=[];
S.push(['Volunteer Dashboard',`<div class="phone">${bar('Dashboard','Your volunteering, at a glance')}<div class="body">
<div class="hero"><i class="orb"></i><span class="pill sk">${I('spark')}Volunteer workspace</span><div class="kick">Good morning, Alex</div><div class="ttl">Your time is making a difference.</div><div class="sub">2 confirmed shifts this week · 46 hours given</div></div>
<div class="grid3">${met('Shifts','14','+3 this month','em')}${met('Events','9','4 causes','in')}${met('Upcoming','2','Next Sunday','sk')}</div>
<div class="sh"><b>Upcoming commitments</b><a>Browse</a></div>
${ev('15','Community Garden Revitalization','Garden tool lead','Central Park East Kiosk')}${ev('19','Food Pantry Packaging','Box assembly assistant','Downtown Warehouse')}
</div>${tabs(0)}</div>`]);
S.push(['Coordinator Workspace',`<div class="phone">${bar('Coordinator','Events & roster operations','back')}<div class="body">
<div class="card alert"><div class="ib" style="background:transparent;border:0;color:var(--amber)">${I('alert')}</div><div style="flex:1"><b style="font-size:12px">7 applications need review</b><div class="sub" style="margin:2px 0 0">Waiting for roster placement</div></div><div class="btn w">Review</div></div>
<div class="grid2">${met('Total events','5','2 live','sk')}${met('Pending','7','Review needed','am')}${met('Accepted','14','Placed','em')}${met('Checked-in','6','On-site','in')}</div>
<div class="btn p">${I('plus')}Create event</div>
<div class="seg"><div class="a">Applications · 7</div><div>Assignments · 14</div><div>Attendance · 6</div></div>
<div class="card"><span class="pill sk">Active shift</span><h3 style="font-size:13px;margin:8px 0 4px">Hlaing Riverbank Conservation</h3><div class="loc sm">${I('pin')}Downtown Riverwalk Plaza</div><div class="stats"><span>3 pending</span><span>6 accepted</span><span>4 on-site</span></div></div>
<div class="card"><span class="pill em">Published</span><h3 style="font-size:13px;margin:8px 0 4px">Youth Coding Mentorship</h3><div class="stats"><span>2 pending</span><span>5 accepted</span></div></div>
</div>${tabs(2)}</div>`]);
S.push(['Availability + Bottom Sheet',`<div class="phone">${bar('Availability','Weekly hours & rules','back')}<div class="body">
<div class="sh"><b>Weekly rules</b><a>+ Add rule</a></div>
<div class="card"><span class="pill in">Saturday</span><div style="font-size:21px;font-weight:800;letter-spacing:-.03em;margin:12px 0 2px">08:00 – 13:00</div><div class="md">MMT · Weekly · Nov 1 – Dec 31</div></div>
<div class="sh"><b>Exceptions & blackouts</b></div>
<div class="card"><div style="display:flex;justify-content:space-between"><span class="pill ro">${I('x')}Blackout</span><span class="sm" style="color:var(--rose);font-size:11px;font-weight:700">Remove</span></div><b style="display:block;margin-top:12px;font-size:15px">Saturday, Nov 21, 2026</b><div class="md">Family commitment</div></div>
</div><div class="scrim"></div><div class="sheet"><div class="hd"></div><b style="font-size:16px">Add weekly availability</b><div class="sub" style="margin:2px 0 12px">Choose a time you can reliably commit.</div>
<div class="lab">Day of week</div><div class="days"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div class="a">S</div><div>S</div></div>
<div class="f2" style="margin-top:0"><div><div class="lab">Start</div><div class="fld">08:00 ${I('clock')}</div></div><div><div class="lab">End</div><div class="fld">13:00 ${I('clock')}</div></div></div>
<div class="f2"><div><div class="lab">Valid from</div><div class="fld">Nov 1, 2026 ${I('cal')}</div></div><div><div class="lab">Valid to</div><div class="fld">Dec 31, 2026 ${I('cal')}</div></div></div>
<div class="f2" style="margin-top:18px"><div class="btn">Cancel</div><div class="btn p">${I('check')}Save rule</div></div></div></div>`]);
S.push(['Create Event · Step 3',`<div class="phone">${bar('Create event','Step 3 of 7 · Schedule','back')}<div class="prog"><i></i></div><div class="body" style="padding-top:10px">
<div class="card" style="display:flex;gap:12px;background:color-mix(in srgb,var(--sky) 9%,var(--surface))"><div style="color:var(--sky)">${I('globe')}</div><div><b style="font-size:12px">Myanmar Time · MMT / UTC+06:30</b><div class="sub" style="margin:3px 0 0;font-size:10.5px">Hours stay anchored to MMT, regardless of device.</div></div></div>
<div class="card"><b style="font-size:14px">Event timing</b>
<div class="f2"><div><div class="lab">Start date</div><div class="fld">Dec 10, 2026 ${I('cal')}</div></div><div><div class="lab">Start time</div><div class="fld">08:00 ${I('clock')}</div></div></div>
<div class="f2"><div><div class="lab">End date</div><div class="fld">Dec 10, 2026 ${I('cal')}</div></div><div><div class="lab">End time</div><div class="fld">14:00 ${I('clock')}</div></div></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">Check-in geofence</b><span class="pill sk">${I('pin')}GPS set</span></div>
<div class="map" style="margin-top:10px"><div class="fence"><div class="pin">${I('pin')}</div></div></div>
<div style="display:flex;justify-content:space-between;margin-top:12px"><span class="lab">Radius</span><b style="font-size:13px">150 m</b></div><div class="slider"><i></i><u></u></div></div>
</div><div class="foot"><div class="btn" style="flex:.4">Back</div><div class="btn p" style="flex:.6">Continue ${I('arrow')}</div></div></div>`]);
document.getElementById('app').innerHTML=S.map(([c,h])=>`<div><div class="cap">${c}</div>${h}</div>`).join('');
const d=document.getElementById('d'),n=document.getElementById('n');
d.onclick=()=>{document.body.classList.remove('night');d.className='on';n.className=''};
n.onclick=()=>{document.body.classList.add('night');n.className='on';d.className=''};
</script></body></html>
