name: v0.12.0 Backend & Client Handshake Integration CI

on:
  push:
    branches: [main, mobile, "v0.12.*"]
  pull_request:
    branches: [main, mobile]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-verification:
    name: Backend, OpenAPI, Mobile & Real-HTTP Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volunteer_coordination_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: volunteer_coordination_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      PHONE_HASH_HMAC_SECRET: test-phone-hmac-secret-32-chars-long!
      OTP_CODE_HMAC_SECRET: test-otp-code-hmac-secret-32-chars!
      AUTH_SESSION_TOKEN_SECRET: test-challenge-session-secret-32!
      PHONE_ENCRYPTION_KEY: q1W2e3R4t5Y6u7I8o9P0a1S2d3F4g5H6j7K8l9Z0x1C=
      ENVIRONMENT: development
      ALLOW_DEV_CODE_IN_AUTH_RESPONSE: "True"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Record Commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/base.txt

      - name: Apply Database-First Schema & Additive Upgrades
        run: |
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d volunteer_coordination_db -f postgres_sql/updated_volunteer_coordination_system_Database.sql
          psql -h 127.0.0.1 -U postgres -d volunteer_coordination_db -f postgres_sql/v0_12_0_auth_otp_challenge_upgrade.sql

      - name: Django System Check
        run: python backend/manage.py check

      - name: Validate OpenAPI 3.0 Contract
        run: python backend/manage.py spectacular --file backend/schema.yml --validate

      - name: Run Backend Domain & BFF Tests
        run: |
          python backend/manage.py test apps.accounts apps.attendance apps.events apps.coordination bff tests --keepdb

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Run Mobile TypeScript Check
        run: |
          cd mobile
          npx tsc --noEmit

      - name: Run Mobile Jest Unit & Contract Tests
        run: |
          cd mobile
          npm test -- --testPathIgnorePatterns=realHttpIntegration

      - name: Execute Real-HTTP Integration Test Suite (Ticket INT-01 / P1-07)
        run: |
          python scripts/run_real_http_suite.py

      - name: Upload Test Output & Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0_12_0-integration-artifacts-${{ steps.commit.outputs.sha }}
          path: |
            docs/integration/v0_12_0_real_http_integration_report.md
            docs/baseline/
            backend/schema.yml
